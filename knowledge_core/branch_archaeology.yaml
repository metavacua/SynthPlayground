  author_date: 2025-10-26 04:57:14 +0000
  committer_date: 2025-10-26 04:57:14 +0000
  subject: Update build process to YAML-LD and JSON-LD standards. This commit refactors the build process to use a YAML-based
    configuration (`build_config.yaml`) and introduces a new protocol compiler for handling JSON-LD and YAML-LD standards.
    The changes include updating the build logic to support YAML, creating a new `build_config.yaml`, and removing the old
    `build_config.json` file. Additionally, a placeholder `protocol_compiler.py` has been added to support the new build process.
  status: inactive
  tags:
  - refactor
  - addition
  purpose: Update build process to YAML-LD and JSON-LD standards. This commit refactors the build process to use a YAML-based
    configuration (`build_config.yaml`) and introduces a new protocol compiler for handling JSON-LD and YAML-LD standards.
    The changes include updating the build logic to support YAML, creating a new `build_config.yaml`, and removing the old
    `build_config.json` file. Additionally, a placeholder `protocol_compiler.py` has been added to support the new build process.
